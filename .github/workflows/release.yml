name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release-version.py "$RELEASE_TAG"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build packages
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles deb,appimage -- --locked

      - name: Collect packages and checksums
        run: |
          mkdir release-assets
          cp src-tauri/target/release/bundle/deb/*.deb release-assets/
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
          cd release-assets
          sha256sum -- *.deb *.AppImage > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attest packages and checksums
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for artifact in release-assets/*; do
            gh attestation verify "$artifact" --repo "$GH_REPO"
          done

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
