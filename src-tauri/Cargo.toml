[package]
name = "kvojps-monitor"
version = "0.1.0"
description = "Indicador de bandeja que reúne IA, Agentes, GitHub, Trello, rede e sistema"
authors = ["Kvojps"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "kvojps_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
ksni = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
dirs = "6"
rustix = { version = "1", features = ["fs"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
